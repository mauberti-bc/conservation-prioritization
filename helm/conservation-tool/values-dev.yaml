# Memory requests and limits: 2560Mi for running services + 512Mi for deployment hooks = 3Gi.
# Allocate 1408Mi to the worker, 448Mi to Prefect server, 320Mi each to API/Postgres, and 64Mi to frontend.
prefect-server:
  ingress:
    host:
      hostname: "conservation-tool-prefect-server-fa9440-dev.apps.gold.devops.gov.bc.ca"
  server:
    uiConfig:
      prefectUiApiUrl: "https://conservation-tool-prefect-server-fa9440-dev.apps.gold.devops.gov.bc.ca/api"
    resources:
      requests:
        cpu: 50m
        memory: 448Mi
      limits:
        cpu: 100m
        memory: 448Mi

services:
  frontend:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 64Mi

  workflows:
    worker:
      profiles:
        sparse-solver:
          executionProfile: dev-1408mi
          # Leave 320Mi of the pod limit for Prefect and orchestration overhead.
          daskWorkerMemory: 1088MiB
          maxPeakMemoryBytes: 1140850688
          resources:
            requests:
              cpu: 100m
              memory: 1408Mi
            limits:
              cpu: "2"
              memory: 1408Mi

  api:
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 320Mi
    route:
      host: "conservation-tool-api-fa9440-dev.apps.gold.devops.gov.bc.ca"

  db:
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 320Mi

env:
  NODE_OPTIONS: "--max-old-space-size=192"
  NODE_ENV: "development"
  FRONTEND_API_HOST: "https://conservation-tool-api-fa9440-dev.apps.gold.devops.gov.bc.ca"

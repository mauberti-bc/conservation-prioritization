# Memory requests: 1536Mi for running services + 512Mi for deployment hooks = 2Gi.
# The worker requests 576Mi and can use up to 704Mi; Postgres requests and limits 256Mi.
prefect-server:
  ingress:
    host:
      hostname: "conservation-tool-prefect-server-fa9440-dev.apps.gold.devops.gov.bc.ca"
  server:
    uiConfig:
      prefectUiApiUrl: "https://conservation-tool-prefect-server-fa9440-dev.apps.gold.devops.gov.bc.ca/api"
    resources:
      requests:
        cpu: 50m
        memory: 384Mi
      limits:
        cpu: 100m
        memory: 384Mi

services:
  frontend:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 64Mi

  workflows:
    worker:
      profiles:
        sparse-solver:
          executionProfile: dev-704mi
          # Leave 320Mi of the pod limit for Prefect and orchestration overhead.
          daskWorkerMemory: 384MiB
          maxPeakMemoryBytes: 402653184
          resources:
            requests:
              cpu: 100m
              memory: 576Mi
            limits:
              cpu: "2"
              memory: 704Mi

  api:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi
    route:
      host: "conservation-tool-api-fa9440-dev.apps.gold.devops.gov.bc.ca"

  db:
    resources:
      requests:
        memory: 256Mi
      limits:
        memory: 256Mi

env:
  NODE_OPTIONS: "--max-old-space-size=160"
  NODE_ENV: "development"
  FRONTEND_API_HOST: "https://conservation-tool-api-fa9440-dev.apps.gold.devops.gov.bc.ca"

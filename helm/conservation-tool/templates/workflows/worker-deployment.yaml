{{- $root := . -}}
{{- range $profileName, $profile := .Values.services.workflows.worker.profiles }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conservation-tool.fullname.prefect-worker" $root }}-{{ $profileName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "conservation-tool.labels" $root | nindent 4 }}
    conservation-tool/workload-profile: {{ $profileName }}
spec:
  replicas: {{ $profile.replicas | default $root.Values.services.workflows.worker.replicas }}
  selector:
    matchLabels:
      app: {{ include "conservation-tool.fullname.prefect-worker" $root }}-{{ $profileName }}
  template:
    metadata:
      labels:
        app: {{ include "conservation-tool.fullname.prefect-worker" $root }}-{{ $profileName }}
        conservation-tool/workload-profile: {{ $profileName }}
      annotations:
        conservation-tool/release-revision: {{ $root.Release.Revision | quote }}
    spec:
      serviceAccountName: deployer
      initContainers:
        - name: sync-prefect-deployments
          image: "{{ $root.Values.registry }}/{{ $root.Values.services.workflows.worker.image.stream }}:{{ $root.Values.services.workflows.worker.image.tag }}"
          imagePullPolicy: {{ $root.Values.services.workflows.worker.image.pullPolicy | default "Always" }}
          command:
            - bash
            - src/setup.sh
          env:
            - name: HOME
              value: "/home/app"
            - name: PREFECT_HOME
              value: "/tmp/.prefect"
            - name: PREFECT_API_URL
              value: "{{ $root.Values.env.PREFECT_API_URL }}"
            - name: ZARR_STORE_PATH
              value: "{{ $root.Values.env.ZARR_STORE_PATH }}"
            - name: WORKFLOW_SCRATCH_ROOT
              value: {{ $profile.scratchRoot | default "/tmp/conservation-workflows" | quote }}
          volumeMounts:
            - name: workflow-tmp
              mountPath: /tmp
      containers:
        - name: prefect-worker
          image: "{{ $root.Values.registry }}/{{ $root.Values.services.workflows.worker.image.stream }}:{{ $root.Values.services.workflows.worker.image.tag }}"
          imagePullPolicy: {{ $root.Values.services.workflows.worker.image.pullPolicy | default "Always" }}
          args:
            - prefect
            - worker
            - start
            - --pool
            - "{{ $profile.pool }}"
          ports:
            - containerPort: {{ $root.Values.ports.prefect_worker_api | default 4202 }}
          env:
            - name: HOME
              value: "/home/app"
            - name: PREFECT_HOME
              value: "/tmp/.prefect"
            - name: PREFECT_API_URL
              value: "{{ $root.Values.env.PREFECT_API_URL }}"
            - name: ZARR_STORE_PATH
              value: "{{ $root.Values.env.ZARR_STORE_PATH }}"
            - name: WORKFLOW_SCRATCH_ROOT
              value: {{ $profile.scratchRoot | default "/tmp/conservation-workflows" | quote }}
            - name: CONSERVATION_API_URL
              value: "{{ $root.Values.env.CONSERVATION_API_URL }}"
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-api
                  key: INTERNAL_API_KEY
            - name: OBJECT_STORE_URL
              value: {{ $root.Values.env.OBJECT_STORE_PUBLIC_ENDPOINT | default $root.Values.env.OBJECT_STORE_URL | quote }}
            - name: OBJECT_STORE_ENDPOINT
              value: {{ $root.Values.env.OBJECT_STORE_PUBLIC_ENDPOINT | default $root.Values.env.OBJECT_STORE_ENDPOINT | quote }}
            - name: OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-object-storage
                  key: OBJECT_STORE_ACCESS_KEY_ID
            - name: OBJECT_STORE_SECRET_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-object-storage
                  key: OBJECT_STORE_SECRET_KEY_ID
            - name: OBJECT_STORE_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-object-storage
                  key: OBJECT_STORE_BUCKET_NAME
            - name: SOURCE_OBJECT_STORE_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-source-object-storage
                  key: SOURCE_OBJECT_STORE_ENDPOINT
            - name: SOURCE_OBJECT_STORE_URL
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-source-object-storage
                  key: SOURCE_OBJECT_STORE_URL
            - name: SOURCE_OBJECT_STORE_REGION
              value: {{ $root.Values.env.SOURCE_OBJECT_STORE_REGION | default $root.Values.env.OBJECT_STORE_REGION | quote }}
            - name: SOURCE_OBJECT_STORE_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-source-object-storage
                  key: SOURCE_OBJECT_STORE_BUCKET_NAME
            - name: SOURCE_BC_BOUNDARY_PATH
              value: {{ $root.Values.env.SOURCE_BC_BOUNDARY_PATH | default "" | quote }}
            - name: SOURCE_OBJECT_STORE_FORCE_PATH_STYLE
              value: {{ $root.Values.env.SOURCE_OBJECT_STORE_FORCE_PATH_STYLE | default $root.Values.env.OBJECT_STORE_FORCE_PATH_STYLE | default "true" | quote }}
            - name: SOURCE_OBJECT_STORE_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-source-object-storage
                  key: SOURCE_OBJECT_STORE_ACCESS_KEY_ID
            - name: SOURCE_OBJECT_STORE_SECRET_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: conservation-tool-source-object-storage
                  key: SOURCE_OBJECT_STORE_SECRET_KEY_ID
            - name: SPATIAL_DASK_WORKERS
              value: {{ $profile.daskWorkers | default 1 | quote }}
            - name: SPATIAL_DASK_WORKER_MEMORY
              value: {{ $profile.daskWorkerMemory | default "1500MB" | quote }}
            - name: SPATIAL_TILE_SIZE
              value: {{ $profile.tileSize | default 1024 | quote }}
            - name: SPATIAL_TILE_SUBMISSION_WAVE
              value: {{ $profile.tileSubmissionWave | default 32 | quote }}
            - name: SPARSE_EXECUTION_PROFILE
              value: {{ $profile.executionProfile | default $profile.pool | quote }}
            - name: SPARSE_PROFILE_MAX_PEAK_MEMORY_BYTES
              value: {{ $profile.maxPeakMemoryBytes | default 25769803776 | quote }}
            - name: SPARSE_PROFILE_MAX_SCRATCH_BYTES
              value: {{ $profile.maxScratchBytes | default 68719476736 | quote }}
            - name: PMTILES_METATILE_SIZE
              value: {{ $profile.pmtilesMetatileSize | default 3 | quote }}
            - name: PMTILES_PNG_COMPRESS_LEVEL
              value: {{ $profile.pmtilesPngCompressLevel | default 3 | quote }}
            - name: PMTILES_MAXIMUM_SOURCE_WINDOW
              value: {{ $profile.pmtilesMaximumSourceWindow | default 2048 | quote }}
            - name: PMTILES_MERGE_FAN_IN
              value: {{ $profile.pmtilesMergeFanIn | default 64 | quote }}
          resources:
            {{- toYaml ($profile.resources | default $root.Values.services.workflows.worker.resources) | nindent 12 }}
          volumeMounts:
            - name: workflow-tmp
              mountPath: /tmp
      volumes:
        - name: workflow-tmp
          emptyDir: {}
---
{{- end }}

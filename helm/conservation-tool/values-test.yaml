environment:
  id: "test"
  name: "test"

# Memory requests and limits: 2560Mi for running services + 512Mi for deployment hooks = 3Gi.
# Allocate 1408Mi to the worker, 448Mi to Prefect server, 320Mi each to API/Postgres, and 64Mi to frontend.
prefect-server:
  ingress:
    host:
      hostname: "conservation-tool-prefect-server-fa9440-test.apps.gold.devops.gov.bc.ca"
  ui:
    podSecurityContext:
      runAsUser: 1003620000
      fsGroup: null
    containerSecurityContext:
      runAsUser: 1003620000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

  server:
    uiConfig:
      prefectUiApiUrl: "https://conservation-tool-prefect-server-fa9440-test.apps.gold.devops.gov.bc.ca/api"
    resources:
      requests:
        cpu: 50m
        memory: 448Mi
      limits:
        cpu: 100m
        memory: 448Mi
    podSecurityContext:
      runAsUser: 1003620000
      fsGroup: null
    containerSecurityContext:
      runAsUser: 1003620000
      runAsNonRoot: true
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

  migrations:
    securityContext:
      runAsUser: 1003620000
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities: {}

database:
  postgresql:
    primary:
      podSecurityContext:
        runAsUser: 1003620000
        fsGroup: 1003620000
      containerSecurityContext:
        runAsUser: 1003620000
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: false
        capabilities:
          drop:
            - ALL

services:
  frontend:
    resources:
      requests:
        memory: 64Mi
      limits:
        memory: 64Mi
    image:
      tag: "test"
    securityContext:
      runAsUser: 1003620000
      fsGroup: 1003620000

  workflows:
    worker:
      image:
        tag: "test"
      securityContext:
        runAsUser: 1003620000
        fsGroup: 1003620000
      profiles:
        sparse-solver:
          executionProfile: test-1408mi
          # Leave 320Mi of the pod limit for Prefect and orchestration overhead.
          daskWorkerMemory: 1088MiB
          maxPeakMemoryBytes: 1140850688
          resources:
            requests:
              cpu: 100m
              memory: 1408Mi
            limits:
              cpu: "2"
              memory: 1408Mi

    deploy:
      image:
        tag: "test"
      securityContext:
        runAsUser: 1003620000
        fsGroup: 1003620000

  api:
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 320Mi
    image:
      tag: "test"
    route:
      host: "conservation-tool-api-fa9440-test.apps.gold.devops.gov.bc.ca"
    securityContext:
      runAsUser: 1003620000
      fsGroup: 1003620000

  db:
    resources:
      requests:
        memory: 320Mi
      limits:
        memory: 320Mi
    image:
      tag: "test"
    securityContext:
      runAsUser: 1003620000
      fsGroup: 1003620000

  dbSetup:
    image:
      tag: "test"

backgroundServices:
  podSecurityContext:
    runAsUser: 1003620000
    fsGroup: 1003620000
  containerSecurityContext:
    runAsUser: 1003620000
    runAsNonRoot: true
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

env:
  NODE_OPTIONS: "--max-old-space-size=192"
  NODE_ENV: "test"
  FRONTEND_API_HOST: "https://conservation-tool-api-fa9440-test.apps.gold.devops.gov.bc.ca"
